# Manual deploy to the EC2 server: GitHub -> Actions -> "Deploy to AWS" -> Run workflow.
#
# Needs (Settings -> Secrets and variables -> Actions):
#   secrets.EC2_HOST     Elastic IP (or DuckDNS name) of the server
#   secrets.EC2_SSH_KEY  full contents of the .pem key pair file
#   vars.APP_DOMAIN      e.g. yourname.duckdns.org (used for the post-deploy health check)
name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the full test suite first (recommended)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests use Testcontainers; Docker is available on GitHub's Ubuntu runners
      - run: mvn -B verify

  build:
    needs: test
    # run when tests passed OR were skipped via the checkbox
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      app_image: ${{ steps.names.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"   # GHCR image names must be lowercase
          echo "app=ghcr.io/${repo}-app" >> "$GITHUB_OUTPUT"
          echo "db=ghcr.io/${repo}-db"   >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:latest
            ${{ steps.names.outputs.app }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push Postgres (PostGIS + pgvector) image
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          push: true
          tags: |
            ${{ steps.names.outputs.db }}:latest
            ${{ steps.names.outputs.db }}:${{ github.sha }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db

      - name: Build and push web image (React app + Caddy)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:latest
            ${{ steps.names.outputs.web }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy compose + Caddy config to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/Caddyfile,deploy/.env.example"
          target: /home/ubuntu/hotelbooking
          overwrite: true

      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/hotelbooking
            test -f .env || { echo "~/hotelbooking/.env is missing - create it from deploy/.env.example first"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f

      - name: Wait for the API to report healthy
        run: |
          url="https://${{ vars.APP_DOMAIN }}/actuator/health"
          for i in $(seq 1 30); do
            if curl -fsS "$url" | grep -q '"UP"'; then echo "Healthy: $url"; exit 0; fi
            echo "Waiting for $url ($i/30)..."; sleep 10
          done
          echo "App did not become healthy. On the server run: docker compose -f docker-compose.prod.yml logs app --tail 200"
          exit 1
