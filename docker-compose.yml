# Local dev infrastructure:  docker compose up -d
#   postgres -> localhost:5433 (PostGIS + pgvector), db/user/password = hotelbooking
# Vibe search uses Amazon Bedrock (Titan Text Embeddings V2). Locally the app picks up your AWS
# credentials from ~/.aws (run `aws configure`) or AWS_PROFILE; without them vibe search returns 503
# and everything else still works.
services:
  postgres:
    build: ./docker/postgres
    image: hotelbooking-postgres:local
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hotelbooking
      POSTGRES_PASSWORD: hotelbooking
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelbooking -d hotelbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
