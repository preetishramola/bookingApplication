spring:
  application:
    name: hotelbooking


  datasource:
    url: jdbc:postgresql://localhost:5432/hotelbooking
    username: ${DB_USER:preetishramola}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always

server:
  port: 8080
