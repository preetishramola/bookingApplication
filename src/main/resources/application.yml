spring:
  application:
    name: hotelbooking

  datasource:
    # Docker Postgres from docker-compose.yml (PostGIS + pgvector). Override with DB_URL / DB_USERNAME / DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hotelbooking}
    username: ${DB_USERNAME:hotelbooking}
    password: ${DB_PASSWORD:hotelbooking}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      # schema script runs first (extensions, PostGIS/pgvector columns + indexes), then seed data
      schema-locations: classpath:db/postgis-pgvector.sql
      # data-dev-admin.sql seeds admin@example.com / admin123 for local dev; the prod profile leaves it out.
      data-locations: classpath:data.sql,classpath:data-dev-admin.sql

  ai:
    model:
      chat: none # we only need embeddings, not a chat model
      embedding: bedrock-titan
    bedrock:
      aws:
        # Credentials come from the default AWS chain: ~/.aws (aws configure / AWS_PROFILE),
        # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, or an attached IAM role.
        region: ${AWS_REGION:ap-south-1}
      titan:
        embedding:
          model: amazon.titan-embed-text-v2:0
          input-type: TEXT

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Local-dev default only. Set JWT_SECRET (at least 32 characters) in any real environment.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-hotelbooking-2026}
    expiration-ms: 86400000 # 24 hours
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10} # raise for API test runs
  geo-search:
    max-radius-km: 100
  vibe-search:
    dimensions: 1024 # must match the embedding model and the vector(1024) column in db/postgis-pgvector.sql
    backfill-on-startup: true
    # nomic-embed-text needed "search_document: " / "search_query: " prefixes; Titan V2 doesn't.
    document-prefix: ""
    query-prefix: ""
